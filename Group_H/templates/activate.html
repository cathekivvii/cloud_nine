{% extends "base.html" %}
{% block content %}
<h2>Activate Reservation: {{ resv.clientName }}</h2>
<div class="row mt-4">
    <div class="col-md-6">
        <div class="card p-3 mb-3">
            <h5>Reservation Details</h5>
            <p><strong>Start:</strong> {{ resv.startDate }}</p>
            <p><strong>End:</strong> {{ resv.endDate }}</p>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-3">
            <h5>Assign Resource</h5>
            <div class="alert alert-info">Select an available resource to assign.</div>
            <form>
                <select class="form-select mb-3">
                    {% for r in resources %}
                    <option value="{{ r.resourceId }}">{{ r.serialNum }} — {{ r.typeName }} (${{ r.baseRate }}/hr)</option>
                    {% endfor %}
                </select>
                <button class="btn btn-success w-100">Activate Deployment</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
